[project]
name = "capability-router"
version = "0.4.0"
description = "Route a task to an LLM model config by matching user-defined capability levels against a user-defined, item-unit catalog."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "httpx>=0.27",
  "rich>=15.0.0",
]

[project.scripts]
capability-router = "capability_router.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capability_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
