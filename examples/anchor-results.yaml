# Fictional anchor pass rates for the tutorial, in the shape examples/levels_from_anchors.py reads:
#   <config>: {<item>: {low: <rate>, mid: <rate>, high: <rate>}}
# Each rate is the share of that level's four anchor problems the config solved. The numbers here
# are made up; they were not measured. See docs/tutorial.md for how a real run would fill this in.
example-large:
  coding: {low: 1.0, mid: 0.75, high: 0.5}
example-mid:
  coding: {low: 1.0, mid: 0.5, high: 0.25}
example-small:
  coding: {low: 0.5, mid: 0.25, high: 0.0}
example-spare:
  coding: {low: 0.75, mid: 0.25, high: 0.0}
